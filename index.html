<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор гнилых высказываний</title>
  <style>
    :root {
      --bg: #1b1d1a;
      --card: #262a25;
      --text: #e8e6d9;
      --muted: #8f9486;
      --accent: #b5c96a;
      --accent-2: #d9a441;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #2b2f28 0%, var(--bg) 70%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      padding: 24px;
    }
    .wrap { width: 100%; max-width: 640px; text-align: center; }
    h1 { font-size: 2rem; margin: 0 0 8px; letter-spacing: 0.5px; }
    .subtitle { color: var(--muted); margin: 0 0 32px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 36px 28px;
      min-height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      border: 1px solid #343a31;
    }
    #phrase {
      font-size: 1.35rem;
      line-height: 1.5;
      margin: 0;
      transition: opacity 0.25s ease;
    }
    #phrase.fade { opacity: 0; }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 1rem;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.1s ease, filter 0.2s ease;
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: scale(0.97); }
    #generate { background: var(--accent); color: #1b1d1a; font-weight: 600; }
    #copy { background: #3a4036; color: var(--text); }
    #copy.done { background: var(--accent-2); color: #1b1d1a; }
    .history {
      margin-top: 36px;
      text-align: left;
    }
    .history h2 { font-size: 1rem; color: var(--muted); font-weight: 500; margin: 0 0 12px; }
    .history ol { padding-left: 20px; margin: 0; color: #bfc3b3; }
    .history li { margin-bottom: 8px; line-height: 1.4; }
    footer { margin-top: 32px; color: #5d6356; font-size: 0.85rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Генератор гнилых высказываний</h1>
    <p class="subtitle">Правда, от которой не становится легче</p>

    <div class="card">
      <p id="phrase">Нажми кнопку, и мир станет чуть циничнее.</p>
    </div>

    <div class="buttons">
      <button id="generate">Сгенерировать</button>
      <button id="copy">Копировать</button>
    </div>

    <section class="history" id="historySection" hidden>
      <h2>Последние</h2>
      <ol id="history"></ol>
    </section>

    <footer>Все фразы собраны из шаблонов. Совпадения с реальностью случайны.</footer>
  </main>

  <script>
    const starts = [
      "Жизнь — это длинная очередь к одному и тому же окошку, и",
      "Все врут, но самое гнилое — что врёшь ты себе первым, ведь",
      "Взрослые не плачут, они просто давно поняли, что",
      "Надежда — это дешёвый наркоз, который",
      "Мечтать вредно, особенно если знаешь, что",
      "Самый честный человек в твоей жизни — это гроб, потому что",
      "Чем старше становишься, тем отчётливее видишь, что",
      "Правда жизни такая же гнилая, как и всё остальное:",
      "Бабушка перед смертью шепнула, что",
      "Наука так и не объяснила, почему"
    ];

    const subjects = [
      "твой успех",
      "любовь до гроба",
      "друзья, которые пропадают сразу после зарплаты",
      "твоя мотивация, которая сдохла в понедельник",
      "завтрашний день",
      "совесть, которую ты давно продал",
      "будущее, которого не будет",
      "каждое «всё будет хорошо»",
      "твои планы на жизнь",
      "твоё здоровье",
      "каждый твой «я просто устал»",
      "отпуск, на котором ты всё равно работаешь"
    ];

    const verbs = [
      "сгниёт раньше, чем ты успеешь ему обрадоваться",
      "давно сдали в ломбард вместе с твоим детством",
      "тоже врёт, просто делает это вежливее",
      "помнит только тот, кому это ещё выгодно",
      "стоит ровно столько, сколько ты уже задолжал",
      "держится на кредите, на таблетках и на тебе",
      "приходит ровно тогда, когда тебя уже не будет",
      "выглядит идеально только в чужих аккаунтах",
      "вспоминают только на поминках, и то пьяными",
      "умирает первым, как только становится тяжело",
      "всегда стоит дороже, чем ты можешь себе позволить",
      "гниёт изнутри, пока снаружи все делают вид, что всё в порядке"
    ];

    const endings = [
      "Спасибо, что дочитал до конца. Теперь тебе тоже не лучше.",
      "Такие дела. Червей хватит на всех.",
      "Записывай, пригодится на поминках.",
      "Улыбайся, пока зубы ещё свои.",
      "Кто понял, тот уже не спрашивает и не просыпается.",
      "Так и живём, а что делать, если выхода нет.",
      "Проверено на собственной шкуре, которая тоже гниёт.",
      ""
    ];

    const extras = [
      "Ты сам согласился это читать, и это, пожалуй, самое смешное.",
      "И это лучшая новость за сегодня, если не считать вчерашней.",
      "Хотя кто тебя спрашивал, кроме тебя самого.",
      "Подумай об этом ночью, когда не уснёшь, и тебе станет чуть хуже.",
      "Главное — не смотреть в зеркало и не смотреть в чек."
    ];

    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

    function generatePhrase() {
      const parts = [pick(starts), pick(subjects), pick(verbs)];
      let phrase = parts.join(" ").replace(/\s+/g, " ");
      const ending = pick(endings);
      if (ending) phrase += ". " + ending;
      if (Math.random() < 0.25) phrase += " " + pick(extras);
      return phrase;
    }

    const phraseEl = document.getElementById("phrase");
    const copyBtn = document.getElementById("copy");
    const historyList = document.getElementById("history");
    const historySection = document.getElementById("historySection");
    const history = [];
    let current = phraseEl.textContent;

    function show(text) {
      phraseEl.classList.add("fade");
      setTimeout(() => {
        phraseEl.textContent = text;
        phraseEl.classList.remove("fade");
      }, 200);
    }

    function addToHistory(text) {
      history.unshift(text);
      if (history.length > 5) history.pop();
      historyList.innerHTML = "";
      history.forEach((item) => {
        const li = document.createElement("li");
        li.textContent = item;
        historyList.appendChild(li);
      });
      historySection.hidden = false;
    }

    document.getElementById("generate").addEventListener("click", () => {
      current = generatePhrase();
      show(current);
      addToHistory(current);
      copyBtn.textContent = "Копировать";
      copyBtn.classList.remove("done");
    });

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(current);
        copyBtn.textContent = "Скопировано!";
        copyBtn.classList.add("done");
      } catch (e) {
        copyBtn.textContent = "Не вышло";
      }
    });
  </script>
</body>
</html>
